<!doctype html>
<!-- Generated by build.py from template.html: edit the template, then rerun the build. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{name}} Case Study | Marve Afo</title>
  <link rel="icon" href="../favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" href="../images/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .viewer-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--color-bg-paper);
      border-bottom: 1px solid var(--color-border-light);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
    }

    .viewer-bar a {
      text-decoration: none;
    }

    .viewer-bar a:hover {
      text-decoration: underline;
    }

    .viewer-pages {
      position: relative;
      max-width: 1440px;
      margin: 0 auto;
      background: var(--color-bg-white);
    }

    .viewer-pages img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Video playing over its frame in the design (position set by build.py).
       The whole frame is a button: tap for sound, then pause / play. */
    .viewer-video {
      position: absolute;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .viewer-video video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .viewer-video:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 3px;
    }

    .viewer-video__badge {
      position: absolute;
      right: var(--space-3);
      bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 6px var(--space-3);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: var(--color-text-inverse);
      font: var(--weight-medium) var(--text-2xs) / 1 var(--font-sans);
      pointer-events: none;
    }

    .viewer-video__badge svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Loading wheel: covers the page until the first slice has loaded */
    .viewer-loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: var(--color-bg-paper);
      transition: opacity 0.3s ease, visibility 0.3s;
    }

    .is-loaded .viewer-loading {
      opacity: 0;
      visibility: hidden;
    }

    .viewer-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--color-border-light);
      border-top-color: var(--color-text);
      border-radius: 50%;
      animation: viewer-spin 0.8s linear infinite;
    }

    @keyframes viewer-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .viewer-spinner {
        animation-duration: 2.4s;
      }
    }
  </style>
</head>
<body>
  <nav class="viewer-bar" aria-label="Case study">
    <a href="../index.html#work">← Back to portfolio</a>
    <a href="{{slug}}.pdf" download>Download PDF</a>
  </nav>

  <div class="viewer-loading" role="status">
    <div class="viewer-spinner" aria-hidden="true"></div>
    <span class="sr-only">Loading case study</span>
  </div>

  <main>
    <h1 class="sr-only">{{name}} case study</h1>
    <div class="viewer-pages">
      {{images}}
      {{video}}
    </div>
    <!-- The case study's text, for screen readers and search engines -->
    <div class="sr-only">
{{text}}
    </div>
  </main>

  <script>
    // Video: plays silently on loop. First tap turns the sound on, then each
    // tap pauses / plays. Reduced motion: starts paused, tap to play.
    const player = document.querySelector(".viewer-video");
    if (player) {
      const video = player.querySelector("video");
      const badge = player.querySelector(".viewer-video__badge");
      const ICONS = {
        sound: '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>',
        pause: '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>',
        play: '<path d="M7 4v16l13-8z"/>',
      };
      const update = () => {
        const [icon, label] =
          video.paused ? ["play", "Play"] : video.muted ? ["sound", "Tap for sound"] : ["pause", "Pause"];
        badge.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[icon]}</svg>${label}`;
        player.setAttribute("aria-label", `${label}: case study video`);
      };

      if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
        video.removeAttribute("autoplay");
        video.pause();
      }
      player.addEventListener("click", () => {
        if (video.paused || video.muted) {
          video.muted = false;
          video.play();
        } else {
          video.pause();
        }
      });
      ["play", "pause", "volumechange"].forEach((e) => video.addEventListener(e, update));
      update();
    }

    // Hide the loading wheel once the first slice is on screen (or fails).
    const first = document.querySelector(".viewer-pages img");
    const done = () => document.documentElement.classList.add("is-loaded");
    if (!first || first.complete) done();
    else {
      first.addEventListener("load", done);
      first.addEventListener("error", done);
    }
  </script>
</body>
</html>
